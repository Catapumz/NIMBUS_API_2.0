version: "3"
services:
  node-express-docker:
    build:
      context: .
    restart: unless-stopped
    volumes:
      - ./:/usr/app
      - ./apks:/usr/app/apks
      - ./fotos:/usr/app/fotos
    ports:
      - "3000:3000"
    command: npm run start
  mongo:
    image: mongo:6.0.5
    restart: unless-stopped
    command: mongod --port 3010
    ports:
      - "3011:3010"
